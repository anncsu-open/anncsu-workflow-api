name: CI

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    name: Validazione spec + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv (con Python 3.12)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check app tests

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      # Gate bloccante: la spec Arazzo deve essere valida.
      - name: Validazione specifica Arazzo (Redocly)
        run: npx --yes @redocly/cli@2.31.5 lint "specs/anncsu-workflow.arazzo.yaml"

      # Gate bloccante: README e docstring devono essere in inglese.
      - name: Installa Vale
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v3.14.2/vale_3.14.2_Linux_64-bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: English-only check (Vale)
        run: vale README.md app tests

      - name: Test
        run: uv run pytest --cov=app
