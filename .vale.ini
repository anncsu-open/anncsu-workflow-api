# Vale configuration — enforces English-only prose in README and Python
# docstrings/comments. Italian ANNCSU domain terms are whitelisted via the
# `ANNCSU` vocabulary (accept.txt). Code blocks are ignored by default.
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = ANNCSU

[*.{md,py}]
BasedOnStyles = ANNCSU
# Official Italian institution/standard names (proper nouns) are not "prose".
TokenIgnores = (Agenzia delle Entrate), (Modello di Interoperabilità), (Piattaforma Digitale Nazionale Dati)
