    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: ANNCSU Workflow API\nconfig:\n  environments:\n    - name: Local\n      variables:\n        - name: baseUrl\n          value: http://localhost:8000\nitems:\n  - info:\n      name: Crea Indirizzo Completo Civico\n      type: http\n      seq: 9\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/verifica-e-crea-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"DELLE CAVE DEL TRULLO\",\n            \"dug\": \"VIA\",\n            \"numero_civico\": \"42\",\n            \"esponente\": \"A\",\n            \"sezione_censimento\": \"580911010001\",\n            \"coordinata_x\": \"13.1022000\",\n            \"coordinata_y\": \"41.8847600\",\n            \"coordinata_z\": \"150\",\n            \"metodo\": \"3\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"creation returns 200 with the new progressivi\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body).to.have.property(\"progressivo_nazionale_odonimo\");\n              expect(res.body).to.have.property(\"progressivo_civico\");\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      WRITE OPERATION \u2014 creates a civic accesso (and its odonimo if missing) on the\n      real ANNCSU. Run only against the collaudo (UAT) environment, never production.\n\n      Civic fork (numero_civico set, metrico absent, ADR 0016): the workflow verifies\n      the odonimo, creates it if needed, checks the civic, then creates the accesso\n      with its coordinate block (x/y/z/metodo). `numero_civico` and `metrico` are\n      mutually exclusive. `sezione_censimento` is required for creation but is not\n      exposed by the read-only search.\n\n      Not yet validated end-to-end against collaudo (no write executed).\n  - info:\n      name: Crea Indirizzo Completo Metrico\n      type: http\n      seq: 10\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/verifica-e-crea-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"DELLE CAVE DEL TRULLO\",\n            \"dug\": \"VIA\",\n            \"metrico\": \"300\",\n            \"sezione_censimento\": \"580911010001\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"metric creation returns 200 with the new progressivi\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body).to.have.property(\"progressivo_nazionale_odonimo\");\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      WRITE OPERATION \u2014 creates a metric accesso (and its odonimo if missing) on the\n      real ANNCSU. Run only against the collaudo (UAT) environment, never production.\n\n      Metric fork (metrico set, numero_civico absent, ADR 0016): a metric accesso is\n      located by a metric value rather than a civic number, so the workflow skips the\n      civic existence check entirely (the Arazzo metric branch: `metrico != null`).\n      `numero_civico` and `metrico` are mutually exclusive.\n\n      Not yet validated end-to-end against collaudo (no write executed).\n  - info:\n      name: Liveness\n      type: http\n      seq: 2\n    http:\n      method: GET\n      url: '{{baseUrl}}/health'\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"liveness returns 200 ok\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.status).to.equal(\"ok\");\n            });\n\n            test(\"response carries a correlation id\", function() {\n              expect(res.headers[\"x-request-id\"]).to.be.a(\"string\");\n            });\n      assertions:\n        - expression: res.status\n          operator: eq\n          value: '200'\n        - expression: res.body.status\n          operator: eq\n          value: ok\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      Liveness probe (ADR 0015). Returns 200 {\"status\":\"ok\"} whenever the process is\n      up, with no external dependency. The X-Request-ID header is the per-request\n      correlation id (ADR 0014). Validated against a running instance.\n  - info:\n      name: Readiness\n      type: http\n      seq: 3\n    http:\n      method: GET\n      url: '{{baseUrl}}/ready'\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"readiness returns a per-source auth status\", function() {\n              expect([200, 503]).to.include(res.status);\n              expect(res.body).to.have.property(\"status\");\n              expect(res.body.sources).to.be.an(\"array\");\n              expect(res.body.sources.length).to.equal(4);\n            });\n\n            test(\"when ready, every source has a PDND voucher with a TTL\", function() {\n              if (res.status === 200) {\n                expect(res.body.status).to.equal(\"ready\");\n                res.body.sources.forEach(function (s) {\n                  expect(s.ok).to.equal(true);\n                  expect(s.token_ttl).to.be.a(\"number\");\n                });\n              }\n            });\n\n            test(\"when not ready, at least one source reports a failure detail\", function() {\n              if (res.status === 503) {\n                expect(res.body.status).to.equal(\"not-ready\");\n                expect(res.body.sources.some(function (s) { return s.ok === false && s.detail; })).to.equal(true);\n              }\n            });\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      Readiness probe (ADR 0015). Checks every Arazzo source (consultazione, accessi,\n      odonimi, coordinate) can obtain a PDND voucher \u2014 cached, refreshed only near\n      expiry, run off the event loop under the per-source lock. 200 with a per-source\n      token_ttl when all four authenticate; 503 with a per-source detail otherwise.\n\n      Validated against PDND collaudo (UAT): all four sources returned ok with\n      token_ttl 600. A common 503 cause is a misconfigured client assertion \u2014 e.g.\n      PDND_AUDIENCE not matching USE_VALIDATION_ENV, or the signing key not matching\n      the public key registered for PDND_KID (PDND error 015-0008).\n  - info:\n      name: Ricerca Indirizzo Completo Inesistente\n      type: http\n      seq: 5\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/ricerca-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"DELLE CAVE DEL TRULLO\",\n            \"numero_civico\": \"999\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"an existing odonimo with no matching civic returns 200, accessi empty\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.odonimi).to.be.an(\"array\").that.is.not.empty;\n              expect(res.body.accessi).to.be.an(\"array\").that.is.empty;\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      The odonimo exists but the civic does not. ANNCSU answers the accessi search\n      with 404 \"non trovati accessi\"; for a read-only search that is \"zero results\",\n      not an error. The `cerca-accessi` step maps a 404 to an `end` (onFailure), so\n      the workflow completes with 200 and an empty `accessi` list instead of a 422.\n\n      Validated against PDND collaudo (UAT): \"DELLE CAVE DEL TRULLO\" civic 999 ->\n      odonimi=1, accessi=0.\n  - info:\n      name: Ricerca Indirizzo Completo esistente\n      type: http\n      seq: 4\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/ricerca-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"DELLE CAVE DEL TRULLO\",\n            \"numero_civico\": \"81\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"returns 200 with the odonimo and at least one access\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.odonimi).to.be.an(\"array\").that.is.not.empty;\n              expect(res.body.accessi).to.be.an(\"array\").that.is.not.empty;\n            });\n\n            test(\"odonimo carries the real wire field names\", function() {\n              var o = res.body.odonimi[0];\n              expect(o).to.have.property(\"prognaz\");\n              expect(o).to.have.property(\"duf\");\n              expect(o).to.have.property(\"dug\");\n            });\n\n            test(\"access carries the real wire field names\", function() {\n              var a = res.body.accessi[0];\n              expect(a).to.have.property(\"prognazacc\");\n              expect(a).to.have.property(\"civico\");\n              expect(a).to.have.property(\"coordX\");\n              expect(a).to.have.property(\"codacccomunale\");\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      Happy path of the read-only search: an odonimo with a matching civic returns\n      200 with both lists populated. The real API field names differ from the OAS\n      (anncsu-sdk#12): odonimi expose `duf` (not `denomuff`) plus `cododocomunale`;\n      accessi expose `coordX`/`coordY` and `codacccomunale`.\n\n      Validated against PDND collaudo (UAT): codcom H501, \"DELLE CAVE DEL TRULLO\"\n      civic 81 -> odonimi=1, accessi=1.\n  - info:\n      name: Ricerca Indirizzo Odonimo Inesistente\n      type: http\n      seq: 8\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/ricerca-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"ZZZVIANONESISTE QWERTY\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"an unknown odonimo returns 200 with both lists empty\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.odonimi).to.be.an(\"array\").that.is.empty;\n              expect(res.body.accessi).to.be.an(\"array\").that.is.empty;\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      No odonimo matches the denomination. ANNCSU answers the odonimi search with\n      404 \"non trovati odonimi\"; the `cerca-odonimi` step maps a 404 to an `end`\n      (onFailure), so the workflow completes with 200 and empty lists rather than a\n      422. The accessi search is never reached.\n\n      Validated against PDND collaudo (UAT): \"ZZZVIANONESISTE QWERTY\" ->\n      odonimi=0, accessi=0.\n  - info:\n      name: Ricerca Indirizzo Solo Odonimi\n      type: http\n      seq: 7\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/ricerca-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"DELLE CAVE DEL TRULLO\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"without a civic, the search returns odonimi and skips accessi\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.odonimi).to.be.an(\"array\").that.is.not.empty;\n              expect(res.body.accessi).to.be.an(\"array\").that.is.empty;\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      `numero_civico` is optional. When it is absent, the `cerca-odonimi` step fires\n      its onSuccess `end` and the accessi search is never attempted, so the result\n      is the odonimi only with an empty `accessi` list.\n\n      Validated against PDND collaudo (UAT): \"DELLE CAVE DEL TRULLO\" with no civic ->\n      odonimi=1, accessi=0.\n  - info:\n      name: Ricerca Indirizzo Disambigua Piu Odonimi\n      type: http\n      seq: 11\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/ricerca-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"AURELIA\",\n            \"numero_civico\": \"131\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"an ambiguous denomination returns all candidates, not the first match\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.odonimi.length).to.be.above(1);\n              expect(res.body.accessi).to.be.an(\"array\").that.is.empty;\n            });\n\n            test(\"each candidate carries its prognaz to re-query\", function() {\n              res.body.odonimi.forEach(function (o) { expect(o).to.have.property(\"prognaz\"); });\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      Disambiguation (ADR 0018): \"AURELIA\" matches several odonimi (CIRCONVALLAZIONE,\n      RAMPA, VIA AURELIA, ...). The search never silently queries the first match: it\n      returns every candidate with an empty `accessi` list, so the caller picks a\n      prognaz and re-queries with `ricerca-accessi-per-odonimo`.\n\n      Validated against PDND collaudo (UAT): \"AURELIA\" civic 131 -> odonimi=11,\n      accessi=0.\n  - info:\n      name: Ricerca Accessi per Odonimo\n      type: http\n      seq: 12\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/ricerca-accessi-per-odonimo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"prognaz\": \"907720\",\n            \"numero_civico\": \"131\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"returns 200 with the resolved odonimo and its accessi\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.odonimi[0].prognaz).to.equal(\"907720\");\n              expect(res.body.odonimi[0].duf).to.equal(\"AURELIA\");\n              expect(res.body.accessi).to.be.an(\"array\").that.is.not.empty;\n            });\n\n            test(\"access carries the real wire field names\", function() {\n              var a = res.body.accessi[0];\n              expect(a).to.have.property(\"prognazacc\");\n              expect(a).to.have.property(\"civico\");\n              expect(a).to.have.property(\"coordX\");\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      By-prognaz search (ADR 0018): resolve a specific odonimo by its national\n      progressive and list its accessi. `numero_civico` maps to `accparz` (a partial\n      civic OR metric value) and is required \u2014 ANNCSU has no unfiltered listing.\n\n      Validated against PDND collaudo (UAT): VIA AURELIA (prognaz 907720), accparz\n      \"131\" -> odonimi=1, accessi=2 (civic \"1311\", a partial match of \"131\").\n  - info:\n      name: Dry-run Accesso 1 Crea\n      type: http\n      seq: 13\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/verifica-e-crea-indirizzo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"DELLE CAVE DEL TRULLO\",\n            \"dug\": \"VIA\",\n            \"numero_civico\": \"99999\",\n            \"sezione_censimento\": \"580911010001\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: after-response\n          code: |-\n            // Capture the new progressivi so step 2 suppresses exactly what we created.\n            bru.setVar(\"dryrun_prognaz\", res.getBody().progressivo_nazionale_odonimo);\n            bru.setVar(\"dryrun_prognazacc\", res.getBody().progressivo_civico);\n        - type: tests\n          code: |-\n            test(\"creation returns 200 with the new progressivi\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.progressivo_nazionale_odonimo).to.be.a(\"string\");\n              expect(res.body.progressivo_civico).to.be.a(\"string\");\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      WRITE OPERATION \u2014 step 1 of a self-cancelling \"dry-run\" pair (mirrors the SDK's\n      `anncsu accesso insert --dry-run`, which inserts an accesso and then rolls it back\n      with an S operation): create an accesso, then suppress it (step 2) so the overall\n      effect on ANNCSU is a no-op. Run only against collaudo (UAT), never production,\n      and ALWAYS run \"Dry-run Accesso 2 Rimuovi\" right after.\n\n      Like the SDK, this targets an EXISTING, uniquely-named odonimo (VIA DELLE CAVE\n      DEL TRULLO in H501) so no orphan odonimo is created \u2014 only an accesso is added\n      then removed. The denomination must be unique in the municipality (ADR 0019) and\n      the civic 99999 is chosen to be clearly non-existent, so the create takes the\n      insert branch (not an update of a real civic) with no collision.\n\n      The post-response script stores the returned progressivi\n      (progressivo_nazionale_odonimo, progressivo_civico) in collection variables that\n      step 2 reads \u2014 run the two in sequence (or run the whole collection in order).\n\n      Note: ANNCSU suppression is a dated LOGICAL suppression, so step 2 leaves a\n      suppressed record rather than erasing all trace \u2014 there is no true delete.\n  - info:\n      name: Dry-run Accesso 2 Rimuovi\n      type: http\n      seq: 14\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/sopprimi-accesso'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"prognaz\": \"{{dryrun_prognaz}}\",\n            \"prognazacc\": \"{{dryrun_prognazacc}}\",\n            \"data_soppressione\": \"{{dryrun_data}}\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: before-request\n          code: |-\n            // Suppress with today's date (DD/MM/YYYY), the format the workflow validates.\n            const d = new Date();\n            const dd = String(d.getDate()).padStart(2, \"0\");\n            const mm = String(d.getMonth() + 1).padStart(2, \"0\");\n            bru.setVar(\"dryrun_data\", `${dd}/${mm}/${d.getFullYear()}`);\n        - type: tests\n          code: |-\n            test(\"suppression of the just-created accesso returns 200\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.success).to.equal(true);\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      WRITE OPERATION \u2014 step 2 of the self-cancelling \"dry-run\" pair: suppress the\n      accesso created by step 1 (\"Dry-run Accesso 1 Crea\"), so the pair nets to no\n      live new accesso. Run only against collaudo (UAT), and only right after step 1.\n\n      Reads the progressivi captured by step 1 from collection variables\n      (dryrun_prognaz, dryrun_prognazacc); running this request in isolation will send\n      empty identifiers and fail. ANNCSU suppression is dated and logical (operation S).\n  - info:\n      name: Ricerca Accessi per Odonimo con Esponente\n      type: http\n      seq: 15\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/ricerca-accessi-per-odonimo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"prognaz\": \"920585\",\n            \"numero_civico\": \"95\",\n            \"esponente\": \"A\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"returns 200 with the civic/esponente access\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.accessi).to.be.an(\"array\").that.is.not.empty;\n              var a = res.body.accessi[0];\n              expect(a.civico).to.equal(\"95\");\n              expect(a.esp).to.equal(\"A\");\n              expect(a).to.have.property(\"prognazacc\");\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      Search the accessi of a specific odonimo (by prognaz) filtered by civic +\n      esponente. `numero_civico` and `esponente` are folded into ANNCSU's `accparz`\n      with the Agenzia delle Entrate format `civico/esponente` (a specificit\xE0 would\n      append `-\u2026`); the concatenated form `95A` does NOT match (ADR 0020).\n\n      Validated against PDND collaudo (UAT): VIA TARANTO (prognaz 920585), civic 95\n      esponente A -> accparz \"95/A\" -> the single 95/A access (prognazacc 33160578).\n  - info:\n      name: Crea Accesso per Odonimo Esistente\n      type: http\n      seq: 16\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/crea-accesso-per-odonimo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"prognaz\": \"920585\",\n            \"numero_civico\": \"95\",\n            \"esponente\": \"A\",\n            \"sezione_censimento\": \"580911010001\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"an already-existing accesso is returned, not duplicated\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.progressivo_nazionale_odonimo).to.equal(\"920585\");\n              expect(res.body.progressivo_civico).to.be.a(\"string\");\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      Add an accesso to an existing odonimo, identified by its national progressive\n      (`prognaz`, required; ADR 0020). Existence is checked from that prognaz with the\n      AdE accparz `civico[/esponente][-specificit\xE0]`: no match -> create; exactly one ->\n      return the existing `prognazacc` (no duplicate); more than one -> fail (ambiguous).\n\n      This example hits the \"already exists\" branch (VIA TARANTO 95/A), so it returns\n      the existing prognazacc WITHOUT writing \u2014 safe to run. The create branch is a\n      WRITE; to exercise it as a no-op, create a clearly-new civic then suppress it\n      (sopprimi-accesso), like the \"Dry-run Accesso\" pair.\n\n      Validated against PDND collaudo (UAT): prognaz 920585, civic 95 esponente A ->\n      returns prognazacc 33160578 (the existing 95/A), no creation.\n  - info:\n      name: Dry-run Odonimo 1 Crea\n      type: http\n      seq: 17\n    http:\n      method: POST\n      url: '{{baseUrl}}/anncsu/v1/workflows/verifica-e-crea-odonimo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"{{dryrun_odonimo_denom}}\",\n            \"dug\": \"VIA\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: before-request\n          code: |-\n            // Unique denomination so the verify step always takes the create branch (ADR 0019),\n            // keeping the dry-run re-runnable without colliding with a prior run's odonimo.\n            const d = new Date();\n            const p = (n) => String(n).padStart(2, \"0\");\n            const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;\n            bru.setVar(\"dryrun_odonimo_denom\", `DRY RUN ${stamp}`);\n        - type: after-response\n          code: |-\n            / {baseUrl}}/anncsu/v1/workflows/sopprimi-odonimo-completo'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"codcom\": \"H501\",\n            \"denom_odonimo\": \"{{dryrun_odonimo_denom}}\",\n            \"data_soppressione\": \"{{dryrun_odonimo_data}}\"\n          }\n      auth: inherit\n    runtime:\n      scripts:\n        - type: before-request\n          code: |-\n            // Suppress with today's date (DD/MM/YYYY), the format the workflow validates.\n            const d = new Date();\n            const dd = String(d.getDate()).padStart(2, \"0\");\n            const mm = String(d.getMonth() + 1).padStart(2, \"0\");\n            bru.setVar(\"dryrun_odonimo_data\", `${dd}/${mm}/${d.getFullYear()}`);\n        - type: tests\n          code: |-\n            test(\"suppression of the just-created odonimo returns 200\", function() {\n              expect(res.status).to.equal(200);\n              expect(res.body.success).to.equal(true);\n            });\n    settings:\n      encodeUrl: false\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      WRITE OPERATION \u2014 step 2 of the self-cancelling \"dry-run\" pair: suppress the\n      odonimo created by step 1 (\"Dry-run Odonimo 1 Crea\"), so the pair nets to no live\n      new odonimo. Run only against collaudo (UAT), and only right after step 1.\n\n      Reads the denomination captured by step 1 from a collection variable\n      (dryrun_odonimo_denom); running this request in isolation will send an empty\n      denomination and fail. The workflow first suppresses any residual accessi\n      (x-executor.foreach), then the odonimo itself \u2014 the freshly-created odonimo has no\n      accessi, so only the odonimo is suppressed. ANNCSU suppression is dated and logical\n      (operation S).\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .gi
