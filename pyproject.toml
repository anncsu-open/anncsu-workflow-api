[project]
name = "anncsu-workflow-api"
version = "1.0.0"
description = "FastAPI API that exposes ANNCSU Arazzo workflows as REST endpoints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "authlib>=1.3.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "anncsu-sdk==0.0.1.dev21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "PL"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Ignora magic values nei test dove i numeri sono auto-documentanti
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]  # Magic values nei test sono chiari dal contesto
"tests/utils/openapi_validator.py" = ["PLR0911", "PLR0912"]  # Complessità necessaria per validazione OpenAPI

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Dipendenze di sviluppo (PEP 735): sincronizzate da `uv sync` di default,
# NON incluse nei metadata del pacchetto pubblicato.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Richiesto da starlette.testclient (FastAPI TestClient) su Starlette >=1.2
    "httpx2>=2.3.0",
    "polyfactory>=2.16.0",
    "faker>=30.0.0",
    "openapi-pydantic>=0.4.1",
    "openapi-spec-validator>=0.7.1",
    "jsonschema>=4.22.0",
    "ruff>=0.7.0",
    "pre-commit>=4.6.0",
    # Generazione docs statiche (Markdown + PlantUML) dalla spec Arazzo
    "pyarazzo>=0.0.6",
    # Ty - Astral's type checker (preview/alpha): installare con `uv tool install ty`
]
