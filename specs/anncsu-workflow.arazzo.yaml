# Specifica Arazzo 1.0 dei workflow ANNCSU.
#
# Costrutti Arazzo 1.0 usati (validati con `redocly lint`):
#   - gli step di un workflow sono SEQUENZIALI nell'ordine dell'array;
#   - il branching condizionale è espresso con onSuccess/onFailure + criteria
#     e azioni goto/end (Arazzo non ha `when` né `dependsOn` a livello di step);
#   - dove Arazzo non basta (coalesce di output tra rami alternativi, iterazione
#     for-each), la responsabilità è DELEGATA all'executor ed è dichiarata in modo
#     esplicito nel blocco `x-executor` del workflow (vedi nota DDD nel vault).
arazzo: 1.0.0
info:
  title: ANNCSU Workflow
  version: 1.0.0
  summary: Workflow di gestione degli indirizzi ANNCSU (odonimi, accessi, coordinate)
  description: |
    Workflow per la gestione completa degli indirizzi nel sistema ANNCSU.
    Include operazioni su odonimi, accessi e coordinate.

    Contatto: infopdnd_anncsu@sogei.it

sourceDescriptions:
  - name: anncsu-consultazione
    url: ./Specifica API - ANNCSU – Consultazione per le PA.yaml
    type: openapi

  - name: anncsu-odonimi
    url: ./Specifica API - ANNCSU - Aggiornamento odonimi.yaml
    type: openapi

  - name: anncsu-accessi
    url: ./Specifica API - ANNCSU - Aggiornamento accessi.yaml
    type: openapi

  - name: anncsu-coordinate
    url: ./Specifica API - ANNCSU - Aggiornamento coordinate.yml
    type: openapi

workflows:
  - workflowId: verifica-e-crea-indirizzo-completo
    summary: Verifica l'esistenza e crea un indirizzo completo
    description: |
      Saga di upsert idempotente: verifica se l'odonimo esiste e, se non esiste,
      lo crea; poi verifica/crea l'accesso (numero civico).
      Pattern "esiste -> cerca, ALTRIMENTI -> crea": espresso con azioni goto/end.
      Il progressivo "risolto" (da ramo cerca o crea) è coalescato dall'executor
      come dichiarato in x-executor.coalesce.
    inputs:
      type: object
      properties:
        codcom:
          type: string
          description: Codice Belfiore del comune
        denom_odonimo:
          type: string
          description: Denominazione dell'odonimo
        dug:
          type: string
          description: Denominazione Urbanistica Generica (es. VIA, PIAZZA)
        numero_civico:
          type: string
          description: Numero civico (esattamente uno tra numero_civico e metrico)
        metrico:
          type: string
          description: Identificazione metrica (esattamente uno tra numero_civico e metrico)
        data_validita:
          type: string
          description: Data di validità amministrativa (DD/MM/YYYY) per le creazioni
        sezione_censimento:
          type: string
          maxLength: 13
          description: >-
            Sezione di censimento dell'accesso (formato ISTAT SEZ21_ID, max 13
            caratteri). Obbligatoria per la creazione dell'accesso
            (operazione_civico I/R); non è derivabile dalle API di consultazione.
        esponente:
          type: string
          description: Esponente del civico
        specificita:
          type: string
          description: Specificità del civico
        isolato:
          type: string
          description: Codice isolato
        codice_civico_comunale:
          type: string
          description: Codice comunale dell'accesso
        coordinata_x:
          type: string
          description: Longitudine WGS84
        coordinata_y:
          type: string
          description: Latitudine WGS84
        coordinata_z:
          type: string
          description: Quota in metri
        metodo:
          type: string
          description: Metodo di rilevazione delle coordinate (1-4)
        denom_localita:
          type: string
          description: Denominazione della località dell'odonimo
        denom_in_lingua_1:
          type: string
          description: Denominazione dell'odonimo in lingua 1
        denom_in_lingua_2:
          type: string
          description: Denominazione dell'odonimo in lingua 2
        codice_comunale:
          type: string
          description: Codice comunale dell'odonimo
        denom_delibera:
          type: string
          description: Denominazione da delibera dell'odonimo (default denom_odonimo)
        provvedimento:
          type: object
          description: Atto amministrativo (delibera) che autorizza l'odonimo
        aut_prefettura:
          type: object
          description: Autorizzazione prefettizia dell'odonimo
    steps:
      # 1) Verifica esistenza odonimo. Se esiste -> goto cerca-odonimo,
      #    altrimenti prosegue (fall-through) verso crea-odonimo.
      - stepId: verifica-odonimo
        description: Verifica se l'odonimo esiste in ANNCSU
        operationId: anncsu-consultazione.esisteOdonimoPost
        requestBody:
          contentType: application/json
          payload:
            req: esisteodonimo
            codcom: $inputs.codcom
            denom: $inputs.denom_odonimo
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: odonimo-esiste
            type: goto
            stepId: cerca-odonimo
            criteria:
              - condition: $response.body.data == true
        outputs:
          odonimo_esistente: $response.body.data

      # 2) Ramo "crea": raggiunto per fall-through quando l'odonimo NON esiste.
      #    Dopo la creazione salta direttamente alla verifica dell'accesso.
      - stepId: crea-odonimo
        description: Crea l'odonimo se non esiste
        operationId: anncsu-odonimi.gestioneAnncsuOdonimiPdnd
        requestBody:
          contentType: application/json
          payload:
            richiesta:
              codcom: $inputs.codcom
              tipo_operazione: I
              dug: $inputs.dug
              denom_localita: $inputs.denom_localita
              denom_in_lingua_1: $inputs.denom_in_lingua_1
              denom_in_lingua_2: $inputs.denom_in_lingua_2
              codice_comunale: $inputs.codice_comunale
              denom_delibera: $inputs.denom_delibera
              provvedimento: $inputs.provvedimento
              aut_prefettura: $inputs.aut_prefettura
              data_valid_amm: $inputs.data_validita
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.esito == "0"
        onSuccess:
          # Accesso metrico: esisteAccessoPost è solo-civico, quindi salta la verifica.
          - name: vai-a-crea-accesso-metrico
            type: goto
            stepId: crea-accesso
            criteria:
              - condition: $inputs.metrico != null
          - name: vai-a-verifica-accesso
            type: goto
            stepId: verifica-accesso
        outputs:
          progressivo_nazionale: $response.body.dati[0].progr_nazionale

      # 3) Ramo "cerca": raggiunto via goto quando l'odonimo esiste.
      #    Prosegue (fall-through) verso verifica-accesso.
      - stepId: cerca-odonimo
        description: Recupera il progressivo nazionale dell'odonimo esistente
        operationId: anncsu-consultazione.elencoodonimiprogPost
        requestBody:
          contentType: application/json
          payload:
            req: elencoodonimiprog
            codcom: $inputs.codcom
            denomparz: $inputs.denom_odonimo
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          # Accesso metrico: salta la verifica civica (esisteAccessoPost è solo-civico).
          - name: vai-a-crea-accesso-metrico
            type: goto
            stepId: crea-accesso
            criteria:
              - condition: $inputs.metrico != null
        outputs:
          progressivo_nazionale: $response.body.data[0].prognaz

      # 4) Verifica esistenza accesso. Se esiste -> goto cerca-accesso,
      #    altrimenti prosegue verso crea-accesso.
      - stepId: verifica-accesso
        description: Verifica se l'accesso (numero civico) esiste
        operationId: anncsu-consultazione.esisteAccessoPost
        requestBody:
          contentType: application/json
          payload:
            req: esisteaccesso
            codcom: $inputs.codcom
            denom: $inputs.denom_odonimo
            accesso: $inputs.numero_civico
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: accesso-esiste
            type: goto
            stepId: cerca-accesso
            criteria:
              - condition: $response.body.data == true
        outputs:
          accesso_esistente: $response.body.data

      # 5) Ramo "crea accesso": raggiunto per fall-through quando l'accesso NON esiste.
      #    progr_nazionale è il valore COALESCATO dall'executor (vedi x-executor.coalesce);
      #    qui referenziamo il ramo "cerca-odonimo" come riferimento statico valido.
      - stepId: crea-accesso
        description: Crea l'accesso se non esiste
        operationId: anncsu-accessi.gestioneAnncsuPdnd
        requestBody:
          contentType: application/json
          payload:
            richiesta:
              codcom: $inputs.codcom
              # Il progressivo dell'odonimo viene dal ramo che ha girato (crea o cerca).
              progr_nazionale:
                x-coalesce:
                  - $steps.crea-odonimo.outputs.progressivo_nazionale
                  - $steps.cerca-odonimo.outputs.progressivo_nazionale
              accesso:
                numero: $inputs.numero_civico
                metrico: $inputs.metrico
                operazione_civico: I
                sezione_censimento: $inputs.sezione_censimento
                data_valid_amm: $inputs.data_validita
                esponente: $inputs.esponente
                specificita: $inputs.specificita
                isolato: $inputs.isolato
                codice_civico_comunale: $inputs.codice_civico_comunale
                coordinate:
                  x: $inputs.coordinata_x
                  y: $inputs.coordinata_y
                  z: $inputs.coordinata_z
                  metodo: $inputs.metodo
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.esito == "0"
        onSuccess:
          - name: fine-dopo-crea-accesso
            type: end
        outputs:
          progressivo_civico: $response.body.dati[0].progr_civico

      # 6) Ramo "cerca accesso": raggiunto via goto quando l'accesso esiste.
      #    Ultimo step: termina naturalmente.
      - stepId: cerca-accesso
        description: Recupera il progressivo civico dell'accesso esistente
        operationId: anncsu-consultazione.elencoaccessiprogPost
        requestBody:
          contentType: application/json
          payload:
            req: elencoaccessiprog
            prognaz: $steps.cerca-odonimo.outputs.progressivo_nazionale
            accparz: $inputs.numero_civico
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          progressivo_civico: $response.body.data[0].prognazacc

    # I valori finali sono COALESCATI dall'executor tra i rami alternativi.
    outputs:
      progressivo_nazionale_odonimo: $steps.cerca-odonimo.outputs.progressivo_nazionale
      progressivo_civico: $steps.cerca-accesso.outputs.progressivo_civico

    x-executor:
      note: |
        Arazzo 1.0 non esprime il coalesce di output tra rami alternativi.
        L'executor deve risolvere i seguenti output prendendo il valore del ramo
        effettivamente eseguito (il primo non nullo nell'ordine indicato).
      coalesce:
        progressivo_nazionale:
          - $steps.cerca-odonimo.outputs.progressivo_nazionale
          - $steps.crea-odonimo.outputs.progressivo_nazionale
        progressivo_civico:
          - $steps.cerca-accesso.outputs.progressivo_civico
          - $steps.crea-accesso.outputs.progressivo_civico

  - workflowId: aggiorna-accesso-da-progressivo
    summary: Aggiorna un accesso identificato dai progressivi nazionali
    description: |
      Aggiornamento generico dell'accesso (operazione R) identificato dal
      progressivo nazionale dell'odonimo e dell'accesso. Patch via
      read-modify-write: legge lo stato attuale (prognazaccPost) e i campi
      forniti dal chiamante lo sovrascrivono (x-coalesce input-su-letto), così
      gli attributi non indicati sono preservati senza che il chiamante debba
      conoscerli. La sezione di censimento NON è esposta dalla consultazione:
      è obbligatoria in input. Copre anche l'aggiornamento delle sole coordinate.
    inputs:
      type: object
      properties:
        codcom:
          type: string
          description: Codice Belfiore del comune
        prognaz:
          type: string
          description: Progressivo nazionale dell'odonimo
        prognazacc:
          type: string
          description: Progressivo nazionale dell'accesso
        sezione_censimento:
          type: string
          maxLength: 13
          description: Sezione di censimento (formato ISTAT SEZ21_ID), obbligatoria
        numero:
          type: string
          maxLength: 5
          description: Numero civico (al più uno tra numero e metrico)
        metrico:
          type: string
          maxLength: 6
          description: Identificazione metrica (al più uno tra numero e metrico)
        esponente:
          type: string
          maxLength: 15
          description: Esponente
        specificita:
          type: string
          maxLength: 5
          description: Specificità
        isolato:
          type: string
          maxLength: 4
          description: Codice isolato
        codice_civico_comunale:
          type: string
          maxLength: 30
          description: Codifica comunale dell'accesso
        data_validita:
          type: string
          description: Data di validità amministrativa (DD/MM/YYYY)
        coordinata_x:
          type: string
          maxLength: 12
          description: Longitudine WGS84
        coordinata_y:
          type: string
          maxLength: 12
          description: Latitudine WGS84
        coordinata_z:
          type: string
          maxLength: 7
          description: Quota in metri
        metodo:
          type: string
          description: Metodo di rilevazione (1-4)
    steps:
      - stepId: leggi-accesso
        description: Legge lo stato attuale dell'accesso per progressivo nazionale
        operationId: anncsu-consultazione.prognazaccPost
        requestBody:
          contentType: application/json
          payload:
            req: prognazacc
            prognazacc: $inputs.prognazacc
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.data.length > 0
        outputs:
          numero: $response.body.data[0].civico
          esponente: $response.body.data[0].esp
          specificita: $response.body.data[0].specif
          metrico: $response.body.data[0].metrico
          codice_civico_comunale: $response.body.data[0].codacccomunale
          coord_x: $response.body.data[0].coordX
          coord_y: $response.body.data[0].coordY
          coord_z: $response.body.data[0].quota
          coord_metodo: $response.body.data[0].metodo

      # I campi non forniti dal chiamante sono preservati dal valore letto
      # (x-coalesce: input PRIMA, lettura POI). La sezione di censimento non è
      # leggibile dalla consultazione, quindi viene solo dall'input.
      - stepId: aggiorna-accesso
        description: Sostituisce lo stato dell'accesso preservando i campi non indicati
        operationId: anncsu-accessi.gestioneAnncsuPdnd
        requestBody:
          contentType: application/json
          payload:
            richiesta:
              codcom: $inputs.codcom
              progr_nazionale: $inputs.prognaz
              accesso:
                progr_civico: $inputs.prognazacc
                operazione_civico: R
                sezione_censimento: $inputs.sezione_censimento
                data_valid_amm: $inputs.data_validita
                isolato: $inputs.isolato
                numero:
                  x-coalesce:
                    - $inputs.numero
                    - $steps.leggi-accesso.outputs.numero
                metrico:
                  x-coalesce:
                    - $inputs.metrico
                    - $steps.leggi-accesso.outputs.metrico
                esponente:
                  x-coalesce:
                    - $inputs.esponente
                    - $steps.leggi-accesso.outputs.esponente
                specificita:
                  x-coalesce:
                    - $inputs.specificita
                    - $steps.leggi-accesso.outputs.specificita
                codice_civico_comunale:
                  x-coalesce:
                    - $inputs.codice_civico_comunale
                    - $steps.leggi-accesso.outputs.codice_civico_comunale
                coordinate:
                  x:
                    x-coalesce:
                      - $inputs.coordinata_x
                      - $steps.leggi-accesso.outputs.coord_x
                  y:
                    x-coalesce:
                      - $inputs.coordinata_y
                      - $steps.leggi-accesso.outputs.coord_y
                  z:
                    x-coalesce:
                      - $inputs.coordinata_z
                      - $steps.leggi-accesso.outputs.coord_z
                  metodo:
                    x-coalesce:
                      - $inputs.metodo
                      - $steps.leggi-accesso.outputs.coord_metodo
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.esito == "0"
        outputs:
          accesso_aggiornato: $response.body.dati[0]

    outputs:
      risultato: $steps.aggiorna-accesso.outputs.accesso_aggiornato

  - workflowId: aggiorna-odonimo-da-progressivo
    summary: Aggiorna un odonimo identificato dal progressivo nazionale
    description: |
      Aggiornamento generico dell'odonimo (operazione R) identificato dal
      progressivo nazionale. Patch via read-modify-write: legge lo stato attuale
      (prognazareaPost) e i campi forniti dal chiamante lo sovrascrivono
      (x-coalesce input-su-letto), così i campi non indicati sono preservati. La
      denominazione di delibera e i provvedimenti NON sono esposti dalla
      consultazione: denom_delibera è obbligatoria in input.
    inputs:
      type: object
      properties:
        codcom:
          type: string
          description: Codice Belfiore del comune
        prognaz:
          type: string
          description: Progressivo nazionale dell'odonimo
        denom_delibera:
          type: string
          maxLength: 120
          description: Denominazione dell'odonimo da delibera, obbligatoria
        dug:
          type: string
          maxLength: 30
          description: Denominazione Urbanistica Generica
        denom_localita:
          type: string
          maxLength: 151
          description: Denominazione località
        denom_in_lingua_1:
          type: string
          maxLength: 150
          description: Denominazione in lingua 1
        denom_in_lingua_2:
          type: string
          maxLength: 150
          description: Denominazione in lingua 2
        codice_comunale:
          type: string
          maxLength: 30
          description: Codice comunale dell'odonimo
        provvedimento:
          type: object
          description: Provvedimento (delibera) che autorizza l'odonimo
        aut_prefettura:
          type: object
          description: Autorizzazione della prefettura
        data_validita:
          type: string
          description: Data di validità amministrativa (DD/MM/YYYY)
    steps:
      - stepId: leggi-odonimo
        description: Legge lo stato attuale dell'odonimo per progressivo nazionale
        operationId: anncsu-consultazione.prognazareaPost
        requestBody:
          contentType: application/json
          payload:
            req: prognazarea
            prognaz: $inputs.prognaz
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.data.length > 0
        outputs:
          dug: $response.body.data[0].dug
          denom_localita: $response.body.data[0].denomloc
          denom_in_lingua_1: $response.body.data[0].denomlingua1
          denom_in_lingua_2: $response.body.data[0].denomlingua2
          codice_comunale: $response.body.data[0].cododocomunale

      # I campi non forniti dal chiamante sono preservati dal valore letto
      # (x-coalesce: input PRIMA, lettura POI). denom_delibera/provvedimento/
      # aut_prefettura non sono leggibili, quindi vengono solo dall'input.
      - stepId: aggiorna-odonimo
        description: Sostituisce lo stato dell'odonimo preservando i campi non indicati
        operationId: anncsu-odonimi.gestioneAnncsuOdonimiPdnd
        requestBody:
          contentType: application/json
          payload:
            richiesta:
              codcom: $inputs.codcom
              tipo_operazione: R
              progr_nazionale: $inputs.prognaz
              denom_delibera: $inputs.denom_delibera
              provvedimento: $inputs.provvedimento
              aut_prefettura: $inputs.aut_prefettura
              data_valid_amm: $inputs.data_validita
              dug:
                x-coalesce:
                  - $inputs.dug
                  - $steps.leggi-odonimo.outputs.dug
              denom_localita:
                x-coalesce:
                  - $inputs.denom_localita
                  - $steps.leggi-odonimo.outputs.denom_localita
              denom_in_lingua_1:
                x-coalesce:
                  - $inputs.denom_in_lingua_1
                  - $steps.leggi-odonimo.outputs.denom_in_lingua_1
              denom_in_lingua_2:
                x-coalesce:
                  - $inputs.denom_in_lingua_2
                  - $steps.leggi-odonimo.outputs.denom_in_lingua_2
              codice_comunale:
                x-coalesce:
                  - $inputs.codice_comunale
                  - $steps.leggi-odonimo.outputs.codice_comunale
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.esito == "0"
        outputs:
          odonimo_aggiornato: $response.body.dati[0]

    outputs:
      risultato: $steps.aggiorna-odonimo.outputs.odonimo_aggiornato

  - workflowId: sopprimi-odonimo-completo
    summary: Sopprime un odonimo previa soppressione degli accessi associati
    description: |
      Soppressione di un odonimo. Invariante ANNCSU: un odonimo NON è sopprimibile
      se ha accessi residui (errore 320 / esito "23"). Quindi PRIMA vanno soppressi
      tutti gli accessi, POI l'odonimo.

      Arazzo 1.0 non ha for-each: l'iterazione di soppressione sugli accessi elencati
      è delegata all'executor (vedi x-executor.foreach), che invoca il workflow
      riusabile `sopprimi-accesso` per ogni elemento di `lista_accessi` PRIMA dello
      step `sopprimi-odonimo`.

      DA CONFERMARE in validazione SOGEI: se il server rifiuta (reject, ipotesi qui
      adottata) o esegue cascade. La soppressione esplicita degli accessi è robusta
      in entrambe le ipotesi (cfr. simulazione SDK + MockTransport nelle note).
    inputs:
      type: object
      properties:
        codcom:
          type: string
          description: Codice Belfiore del comune
        denom_odonimo:
          type: string
          description: Denominazione dell'odonimo da sopprimere
        data_soppressione:
          type: string
          description: Data di soppressione (formato DD/MM/YYYY)
    steps:
      - stepId: cerca-odonimo
        description: Cerca l'odonimo per ottenere il progressivo nazionale
        operationId: anncsu-consultazione.elencoodonimiprogPost
        requestBody:
          contentType: application/json
          payload:
            req: elencoodonimiprog
            codcom: $inputs.codcom
            denomparz: $inputs.denom_odonimo
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.data.length > 0
        outputs:
          progressivo_nazionale: $response.body.data[0].prognaz
          denom_completa: $response.body.data[0].duf

      - stepId: elenca-accessi
        description: Elenca tutti gli accessi dell'odonimo (consumati dall'executor)
        operationId: anncsu-consultazione.elencoaccessiprogPost
        requestBody:
          contentType: application/json
          payload:
            req: elencoaccessiprog
            prognaz: $steps.cerca-odonimo.outputs.progressivo_nazionale
            accparz: ""
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          lista_accessi: $response.body.data

      # NOTA: tra `elenca-accessi` e `sopprimi-odonimo` l'executor itera la
      # soppressione degli accessi (x-executor.foreach -> workflow sopprimi-accesso).
      - stepId: sopprimi-odonimo
        description: Sopprime l'odonimo (richiede zero accessi residui)
        operationId: anncsu-odonimi.gestioneAnncsuOdonimiPdnd
        requestBody:
          contentType: application/json
          payload:
            richiesta:
              codcom: $inputs.codcom
              tipo_operazione: S
              progr_nazionale: $steps.cerca-odonimo.outputs.progressivo_nazionale
              data_valid_amm: $inputs.data_soppressione
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.esito == "0"
        onFailure:
          - name: accessi-residui
            type: end
            criteria:
              - condition: $response.body.esito == "23"
        outputs:
          risultato_soppressione: $response.body

    outputs:
      odonimo_soppresso: $steps.cerca-odonimo.outputs.denom_completa
      progressivo_nazionale: $steps.cerca-odonimo.outputs.progressivo_nazionale
      accessi_presenti: $steps.elenca-accessi.outputs.lista_accessi
      esito: $steps.sopprimi-odonimo.outputs.risultato_soppressione

    x-executor:
      note: |
        Arazzo 1.0 non ha for-each. L'executor, dopo `elenca-accessi` e PRIMA di
        `sopprimi-odonimo`, deve iterare su `lista_accessi` invocando il workflow
        `sopprimi-accesso` per ogni accesso. Se anche un solo accesso fallisce la
        soppressione, NON procedere con `sopprimi-odonimo`.
      foreach:
        over: $steps.elenca-accessi.outputs.lista_accessi
        as: accesso
        before: sopprimi-odonimo
        invoke:
          workflowId: sopprimi-accesso
          inputs:
            codcom: $inputs.codcom
            prognaz: $steps.cerca-odonimo.outputs.progressivo_nazionale
            prognazacc: $accesso.prognazacc
            data_soppressione: $inputs.data_soppressione

  - workflowId: sopprimi-accesso
    summary: Sopprime un singolo accesso (civico) di un odonimo
    description: |
      Soppressione di un singolo accesso (operazione S, soppressione datata).
      Esposto come endpoint standalone (per togliere un civico senza toccare
      l'odonimo) ed è anche il workflow riusabile iterato dal foreach di
      sopprimi-odonimo-completo.
    inputs:
      type: object
      properties:
        codcom:
          type: string
          description: Codice Belfiore del comune
        prognaz:
          type: string
          description: Progressivo nazionale dell'odonimo
        prognazacc:
          type: string
          description: Progressivo nazionale dell'accesso da sopprimere
        data_soppressione:
          type: string
          description: Data di soppressione (formato DD/MM/YYYY)
    steps:
      - stepId: sopprimi-accesso
        description: Sopprime l'accesso (civico) indicato
        operationId: anncsu-accessi.gestioneAnncsuPdnd
        requestBody:
          contentType: application/json
          payload:
            richiesta:
              codcom: $inputs.codcom
              progr_nazionale: $inputs.prognaz
              accesso:
                progr_civico: $inputs.prognazacc
                operazione_civico: S
                data_valid_amm: $inputs.data_soppressione
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.esito == "0"
        outputs:
          esito: $response.body.esito

    outputs:
      esito: $steps.sopprimi-accesso.outputs.esito

  - workflowId: ricerca-indirizzo-completo
    summary: Ricerca completa di un indirizzo (sola lettura)
    description: |
      Cerca gli odonimi corrispondenti e, se è indicato il numero civico, anche
      gli accessi. Lo step accessi è saltato (azione end con criteria) quando
      `numero_civico` non è valorizzato.
    inputs:
      type: object
      properties:
        codcom:
          type: string
          description: Codice Belfiore del comune
        denom_odonimo:
          type: string
          description: Denominazione dell'odonimo
        numero_civico:
          type: string
          description: Numero civico (opzionale)
    steps:
      - stepId: cerca-odonimi
        description: Cerca odonimi che corrispondono
        operationId: anncsu-consultazione.elencoodonimiprogPost
        requestBody:
          contentType: application/json
          payload:
            req: elencoodonimiprog
            codcom: $inputs.codcom
            denomparz: $inputs.denom_odonimo
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: salta-accessi-se-no-civico
            type: end
            criteria:
              - condition: $inputs.numero_civico == null
        # ANNCSU risponde 404 quando la ricerca odonimi non trova nulla: come per
        # gli accessi, "zero risultati" termina con liste vuote, non è un errore.
        onFailure:
          - name: nessun-odonimo-trovato
            type: end
            criteria:
              - condition: $statusCode == 404
        outputs:
          odonimi_trovati: $response.body.data
          progressivo_nazionale: $response.body.data[0].prognaz

      - stepId: cerca-accessi
        description: Cerca gli accessi del primo odonimo trovato
        operationId: anncsu-consultazione.elencoaccessiprogPost
        requestBody:
          contentType: application/json
          payload:
            req: elencoaccessiprog
            prognaz: $steps.cerca-odonimi.outputs.progressivo_nazionale
            accparz: $inputs.numero_civico
        successCriteria:
          - condition: $statusCode == 200
        # ANNCSU risponde 404 quando la ricerca accessi non trova nulla: per una
        # ricerca "zero risultati" non è un errore -> termina con accessi vuoti.
        # Gli altri errori (400/5xx) non hanno azione e restano un fallimento.
        onFailure:
          - name: nessun-accesso-trovato
            type: end
            criteria:
              - condition: $statusCode == 404
        outputs:
          accessi_trovati: $response.body.data

    outputs:
      odonimi: $steps.cerca-odonimi.outputs.odonimi_trovati
      accessi: $steps.cerca-accessi.outputs.accessi_trovati

x-arazzo-extensions:
  x-rate-limiting:
    description: Le API ANNCSU sono soggette ai limiti di rate limiting di PDND

  x-security-notes:
    description: |
      Tutte le API richiedono autenticazione tramite:
      - Bearer token JWT (RFC8725)
      - Header Agid-JWT-Signature per integrità del payload
      - Header Agid-JWT-TrackingEvidence per tracciamento
